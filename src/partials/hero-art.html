<svg class="hero-chart" viewBox="0 0 640 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-art-title hero-art-desc" font-family="Poppins, system-ui, sans-serif">
  <title id="hero-art-title">A student portfolio dashboard</title>
  <desc id="hero-art-desc">A simulated $1,000,000 portfolio growing over two weeks, with a certificate card and the instructor's badge.</desc>

  <!-- soft circle behind the card -->
  <circle cx="420" cy="230" r="215" fill="#EAF6FE"/>

  <!-- main card -->
  <g>
    <rect x="60" y="40" width="520" height="352" rx="18" fill="#FFFFFF" stroke="#BFE2FB" stroke-width="1.5"/>
    <!-- header -->
    <g transform="translate(88,66)">
      <circle cx="16" cy="16" r="16" fill="#3FA9F5"/>
      <path d="M11.5 8.5 16 14.5 20.5 8.5" fill="none" stroke="#FFC72C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M11.5 23.5 16 17.5 20.5 23.5" fill="none" stroke="#FFC72C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 12.5 10 16 6 19.5M26 12.5 22 16 26 19.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="12" font-size="12" font-weight="700" fill="#2B8FD8" letter-spacing="1.2">YOUR PORTFOLIO</text>
      <text x="44" y="30" font-size="12.5" font-weight="500" fill="#5A7089">Virtual exchange · live market data</text>
    </g>
    <rect x="432" y="68" width="124" height="28" rx="14" fill="#FFF6DC"/>
    <text x="494" y="87" font-size="12.5" font-weight="700" fill="#B07A10" text-anchor="middle">Beginner · Week 2</text>

    <!-- big number -->
    <text x="88" y="150" font-size="40" font-weight="800" fill="#0B2F5B" letter-spacing="-0.5" data-count="1000000" data-prefix="$">$1,000,000</text>
    <rect x="88" y="162" width="92" height="24" rx="12" fill="#FFC72C"/>
    <text x="134" y="179" font-size="13" font-weight="800" fill="#0B2F5B" text-anchor="middle">+ 12.4 %</text>
    <text x="192" y="179" font-size="13" font-weight="600" fill="#5A7089">since day 1</text>

    <!-- chart -->
    <g transform="translate(88,200)">
      <line x1="0" y1="140" x2="464" y2="140" stroke="#D7ECFB" stroke-width="1.5"/>
      <line x1="0" y1="100" x2="464" y2="100" stroke="#EAF6FE" stroke-width="1.5"/>
      <line x1="0" y1="60" x2="464" y2="60" stroke="#EAF6FE" stroke-width="1.5"/>
      <line x1="0" y1="20" x2="464" y2="20" stroke="#EAF6FE" stroke-width="1.5"/>
      <path class="hero-chart__area" d="M0 118 C 40 112, 60 124, 90 108 S 150 70, 190 86 S 250 60, 290 58 S 350 40, 390 36 S 440 22, 464 14 L 464 140 L 0 140 Z" fill="#EAF6FE"/>
      <path class="hero-chart__line" d="M0 118 C 40 112, 60 124, 90 108 S 150 70, 190 86 S 250 60, 290 58 S 350 40, 390 36 S 440 22, 464 14" fill="none" stroke="#3FA9F5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="hero-chart__dot">
        <circle cx="464" cy="14" r="11" fill="#FFC72C" fill-opacity=".35"/>
        <circle cx="464" cy="14" r="6" fill="#FFC72C" stroke="#FFFFFF" stroke-width="2"/>
      </g>
      <text x="0" y="162" font-size="11.5" font-weight="600" fill="#5A7089">Day 1</text>
      <text x="232" y="162" font-size="11.5" font-weight="600" fill="#5A7089" text-anchor="middle">Week 1</text>
      <text x="464" y="162" font-size="11.5" font-weight="600" fill="#5A7089" text-anchor="end">Pitch day</text>
    </g>
  </g>

  <!-- holdings chips -->
  <g transform="translate(60,424)" font-size="12.5" font-weight="700">
    <rect width="150" height="40" rx="10" fill="#FFFFFF" stroke="#BFE2FB" stroke-width="1.5"/>
    <rect x="12" y="12" width="16" height="16" rx="4" fill="#3FA9F5"/>
    <text x="38" y="19" fill="#0B2F5B">Index ETF</text>
    <text x="38" y="32" font-size="11" font-weight="600" fill="#5A7089">60 % · passive core</text>
    <rect x="162" width="150" height="40" rx="10" fill="#FFFFFF" stroke="#BFE2FB" stroke-width="1.5"/>
    <rect x="174" y="12" width="16" height="16" rx="4" fill="#FFC72C"/>
    <text x="200" y="19" fill="#0B2F5B">Value picks</text>
    <text x="200" y="32" font-size="11" font-weight="600" fill="#5A7089">25 % · on sale</text>
    <rect x="324" width="150" height="40" rx="10" fill="#FFFFFF" stroke="#BFE2FB" stroke-width="1.5"/>
    <rect x="336" y="12" width="16" height="16" rx="4" fill="#2B8FD8"/>
    <text x="362" y="19" fill="#0B2F5B">Growth picks</text>
    <text x="362" y="32" font-size="11" font-weight="600" fill="#5A7089">15 % · tomorrow</text>
  </g>

  <!-- certificate card -->
  <g transform="translate(484,296)">
    <rect width="156" height="118" rx="14" fill="#FFFFFF" stroke="#BFE2FB" stroke-width="1.5"/>
    <circle cx="30" cy="34" r="18" fill="#FFC72C"/>
    <circle cx="30" cy="31" r="8" fill="none" stroke="#0B2F5B" stroke-width="2.2"/>
    <path d="M24 38l-2.5 9 8.5-4.5 8.5 4.5-2.5-9" fill="none" stroke="#0B2F5B" stroke-width="2.2" stroke-linejoin="round"/>
    <text x="58" y="30" font-size="12.5" font-weight="800" fill="#0B2F5B">Certificate</text>
    <text x="58" y="46" font-size="11" font-weight="600" fill="#5A7089">of completion</text>
    <rect x="16" y="66" width="124" height="8" rx="4" fill="#EAF6FE"/>
    <rect x="16" y="66" width="98" height="8" rx="4" fill="#3FA9F5"/>
    <text x="16" y="96" font-size="11.5" font-weight="700" fill="#2B8FD8">Lesson 7 of 8 · 2 weeks</text>
  </g>
</svg>
