<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="inv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2F5B"/>
      <stop offset="1" stop-color="#1E3A5F"/>
    </linearGradient>
    <radialGradient id="inv-glow" cx="0.8" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#3FA9F5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3FA9F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inv-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC72C" stop-opacity=".32"/>
      <stop offset="1" stop-color="#FFC72C" stop-opacity="0"/>
    </linearGradient>
    <filter id="inv-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="320" height="320" fill="url(#inv-bg)"/>
  <rect width="320" height="320" fill="url(#inv-glow)"/>

  <!-- the screen grid -->
  <g stroke="#FFFFFF" stroke-opacity=".08" stroke-width="1.5">
    <path d="M0 64H320M0 122H320M0 180H320M0 238H320"/>
    <path d="M52 0V320M116 0V320M180 0V320M244 0V320"/>
  </g>

  <!-- candlesticks, rising -->
  <g stroke-width="3" stroke-linecap="round">
    <path d="M30 212V268" stroke="#BFE2FB" stroke-opacity=".7"/>
    <rect x="21" y="224" width="18" height="32" rx="4" fill="#BFE2FB" fill-opacity=".7"/>
    <path d="M66 196V252" stroke="#3FA9F5"/>
    <rect x="57" y="206" width="18" height="34" rx="4" fill="#3FA9F5"/>
    <path d="M102 208V250" stroke="#BFE2FB" stroke-opacity=".7"/>
    <rect x="93" y="216" width="18" height="24" rx="4" fill="#BFE2FB" fill-opacity=".7"/>
    <path d="M138 164V226" stroke="#3FA9F5"/>
    <rect x="129" y="174" width="18" height="40" rx="4" fill="#3FA9F5"/>
    <path d="M174 150V204" stroke="#3FA9F5"/>
    <rect x="165" y="158" width="18" height="34" rx="4" fill="#3FA9F5"/>
    <path d="M210 160V200" stroke="#BFE2FB" stroke-opacity=".7"/>
    <rect x="201" y="168" width="18" height="22" rx="4" fill="#BFE2FB" fill-opacity=".7"/>
    <path d="M246 104V172" stroke="#3FA9F5"/>
    <rect x="237" y="114" width="18" height="46" rx="4" fill="#3FA9F5"/>
    <path d="M282 66V132" stroke="#FFC72C"/>
    <rect x="273" y="76" width="18" height="44" rx="4" fill="#FFC72C"/>
  </g>

  <!-- the trend line, with its glow -->
  <path d="M10 262C56 250 78 214 120 216S176 168 214 164 268 104 310 62V320H10Z" fill="url(#inv-area)"/>
  <path d="M10 262C56 250 78 214 120 216S176 168 214 164 268 104 310 62" fill="none" stroke="#FFC72C" stroke-width="12" stroke-linecap="round" opacity=".5" filter="url(#inv-blur)"/>
  <path d="M10 262C56 250 78 214 120 216S176 168 214 164 268 104 310 62" fill="none" stroke="#FFC72C" stroke-width="5" stroke-linecap="round"/>
  <circle cx="282" cy="92" r="16" fill="#FFC72C" fill-opacity=".25"/>
  <circle cx="282" cy="92" r="8" fill="#FFC72C" stroke="#FFFFFF" stroke-width="3"/>

  <!-- two interface pills, top left -->
  <rect x="22" y="22" width="84" height="20" rx="10" fill="#FFFFFF" fill-opacity=".16"/>
  <rect x="114" y="22" width="44" height="20" rx="10" fill="#FFC72C"/>
</svg>
